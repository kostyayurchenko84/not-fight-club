<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/battlesyle.css" />
    <link rel="icon" href="../assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const savedName = localStorage.getItem('heroName')
        const avatarIndex = localStorage.getItem('avatar') || 0

        const avatars = [
          '../assets/img/Krosh_400x389.jpg',
          '../assets/img/Barash_400x389.jpg',
          '../assets/img/Ezh_400x389.jpg',
          '../assets/img/Kopatych_400x389.jpg',
          '../assets/img/Krosh_400x389.jpg',
          '../assets/img/Pin_400x389.jpg',
          '../assets/img/Sova_400x389.jpg',
        ]
        const pcAvatars = [
          '../assets/img/Pokemon1_400.jpg',
          '../assets/img/Pokemon2_400.jpg',
          '../assets/img/Pokemon3_400.jpg',
          '../assets/img/Pokemon4_400.jpg',
        ]

        const currentAvatar = document.querySelector('.currentAvatar')
        if (avatars[avatarIndex]) {
          currentAvatar.src = avatars[avatarIndex]
        }

        const pcAvatar = document.querySelector('.pcAvatar')
        const randomPcAvatarIndex = Math.floor(Math.random() * pcAvatars.length)
        pcAvatar.src = pcAvatars[randomPcAvatarIndex]

        document.querySelector('.playerName').textContent = savedName
        document.querySelector('.pcName').textContent = `Monster ${randomPcAvatarIndex}`

        //localStorage.setItem('pcAvatarIndex', randomPcAvatarIndex);

        const attackCheckboxes = document.querySelectorAll('.attack')
        attackCheckboxes.forEach((checkbox) => {
          checkbox.addEventListener('change', function () {
            if (this.checked) {
              attackCheckboxes.forEach((cb) => {
                if (cb !== this) cb.checked = false
              })
            }
          })
        })

        const defenseCheckboxes = document.querySelectorAll('.defense')
        defenseCheckboxes.forEach((checkbox) => {
          checkbox.addEventListener('change', function () {
            const checked = document.querySelectorAll('.defense:checked').length
            if (checked > 2) {
              this.checked = false
              alert('You can choose only two defense zones.')
            }
          })
        })

        function addLogMessage(message) {
          const logContent = document.querySelector('.log-content')
          const messageElement = document.createElement('p')
          messageElement.textContent = message
          logContent.appendChild(messageElement)
          logContent.scrollTop = logContent.scrollHeight
        }
      })
    </script>
    <title>Not Fight Club</title>
  </head>
  <body>
    <header class="header">
      <h1>Battle</h1>
    </header>
    <main>
      <section class="battle-section roboto-regular">
        <div class="container">
          <div class="heroData">
            <p class="playerName"></p>
            <img class="currentAvatar" src="../assets/img/Krosh_400x389.jpg" alt="currentAvatar" />
            <div class="hp-bar-container">
              <div class="hp-bar" data-hp="150"></div>
              <span class="hp-text">150/150</span>
            </div>
          </div>
          <div class="battleData">
            <p>Pick one Attack zone and two Defense zone:</p>
            <div class="battle-options">
              <div class="battle-list-options">
                <h3>Attack zone</h3>
                <div class="battle-option-group">
                  <input type="checkbox" id="attack-head" class="attack" value="head" checked />
                  <label for="attack-head">Head</label>
                </div>
                <div class="battle-option-group">
                  <input type="checkbox" id="attack-neck" class="attack" value="neck" />
                  <label for="attack-neck">Neck</label>
                </div>
                <div class="battle-option-group">
                  <input type="checkbox" id="attack-body" class="attack" value="body" />
                  <label for="attack-body">Body</label>
                </div>
                <div class="battle-option-group">
                  <input type="checkbox" id="attack-belly" class="attack" value="belly" />
                  <label for="attack-belly">Belly</label>
                </div>
                <div class="battle-option-group">
                  <input type="checkbox" id="attack-legs" class="attack" value="legs" />
                  <label for="attack-legs">Legs</label>
                </div>
              </div>
              <div class="battle-list-options">
                <h3>Defense zone</h3>
                <div class="battle-option-group">
                  <input type="checkbox" id="defense-head" class="defense" value="head" checked />
                  <label for="defense-head">Head</label>
                </div>
                <div class="battle-option-group">
                  <input type="checkbox" id="defense-neck" class="defense" value="neck" />
                  <label for="defense-neck">Neck</label>
                </div>
                <div class="battle-option-group">
                  <input type="checkbox" id="defense-body" class="defense" value="body" />
                  <label for="defense-body">Body</label>
                </div>
                <div class="battle-option-group">
                  <input type="checkbox" id="defense-belly" class="defense" value="belly" />
                  <label for="defense-belly">Belly</label>
                </div>
                <div class="battle-option-group">
                  <input type="checkbox" id="defense-legs" class="defense" value="legs" />
                  <label for="defense-legs">Legs</label>
                </div>
              </div>
            </div>
            <button class="battle-btn">Attack!</button>
          </div>
          <div class="pcData">
            <p class="pcName"></p>
            <img class="pcAvatar" src="../assets/img/Pokemon1_400.jpg" alt="pcAvatar" />
            <div class="hp-bar-container">
              <div class="hp-bar" data-hp="150"></div>
              <span class="hp-text">150/150</span>
            </div>
          </div>
        </div>
        <div class="battle-log">
          <h3>Battle Log:</h3>
          <div class="log-content">
            <p>Battle log here</p>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <a class="linkBack" href="../pages/MainMenuPage.html">Back</a>
    </footer>
  </body>
</html>
