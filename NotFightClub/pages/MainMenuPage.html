<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/mainmenustyle.css" />
    <link rel="icon" href="../assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>NotFightClub</title>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const heroName = localStorage.getItem('heroName')
        const heroTitle = document.querySelector('.heroName')
        heroName ? (heroTitle.textContent = heroName) : (heroTitle.textContent = 'Unknown Hero')

        const quitLink = document.querySelector('.quitLink')
        quitLink.addEventListener('click', function (e) {
          e.preventDefault()
          localStorage.removeItem('heroName')
          localStorage.removeItem('wins')
          localStorage.removeItem('loses')
          localStorage.removeItem('avatar')
          window.location.href = '../index.html'
        })
      })
    </script>
  </head>
  <body>
    <header class="header">
      <h1 class="heroName"></h1>
    </header>
    <main>
 <!-- Позже доработать чтобы название страницы было вверху вместо имени, а имя спустить к контенту-->
      <div class="container">
        <h2>Main menu</h2>
        <nav class="nav">
          <ul class="nav-list roboto-thin">
            <li><a href="BattlePage.html">Fight</a></li>
            <li><a href="AccountPage.html">Account</a></li>
            <li><a href="SettingsPage.html">Settings</a></li>
            <li><a class="quitLink" href="../index.html">Quit</a></li>
          </ul>
        </nav>
      </div>
    </main>
  </body>
</html>
