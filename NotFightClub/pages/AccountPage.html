<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Page</title>
    <link rel="stylesheet" href="../css/mainmenustyle.css" />
    <link rel="icon" href="../assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const heroName = localStorage.getItem('heroName')
        const heroTitle = document.getElementById('heroName')
        heroName ? (heroTitle.textContent = heroName) : (heroTitle.textContent = 'Unknown Hero')
      })
    </script>
  </head>
  <body>
    <header class="header">
      <h1 id="heroName"></h1>
    </header>
    <main></main>
  </body>
</html>
